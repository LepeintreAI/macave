{% extends "base.html" %}
{% block contenu %}
<h1>Modifier mon évaluation</h1>
<p>{{ vin.domaine }} — {{ vin.nom }} ({{ vin.millesime }})</p>
<form method="post">
  <label for="note">Note (0 à 20)</label>
  <input id="note" name="note" type="number" min="0" max="20" value="{{ ev.note }}" required>
  <label for="commentaire">Commentaire (facultatif)</label>
  <textarea id="commentaire" name="commentaire">{{ ev.commentaire or "" }}</textarea>
  <button type="submit">Enregistrer</button>
</form>
{% endblock %}
